<VirtualHost *:80>
    ServerName 192.168.1.102
    DocumentRoot "C:/pos/public"

    <Directory "C:/pos/public">
        AllowOverride All
        Options -Indexes
        Require all granted
    </Directory>

    ServerSignature Off
    ErrorLog "logs/ospos-error.log"
    CustomLog "logs/ospos-access.log" combined
</VirtualHost>
